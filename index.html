<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/favicon/derp_face.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;700&family=Oxygen:wght@400;700&display=swap" rel="stylesheet" />
    <title>BozoBus67</title>
    <style>
      main { font-family: Arial, sans-serif; }
      main h2, main h3 { font-family: 'Oxygen', sans-serif; }
      .scroll-container { scrollbar-width: thin; scrollbar-color: transparent transparent; transition: scrollbar-color 0.5s ease; }
      .scroll-container.is-scrolling { scrollbar-color: rgba(120, 120, 120, 0.55) transparent; }
      .scroll-container::-webkit-scrollbar { width: 10px; height: 10px; }
      .scroll-container::-webkit-scrollbar-track { background: transparent; }
      .scroll-container::-webkit-scrollbar-thumb { background-color: rgba(120, 120, 120, 0); border-radius: 5px; transition: background-color 0.5s ease; }
      .scroll-container.is-scrolling::-webkit-scrollbar-thumb { background-color: rgba(120, 120, 120, 0.55); }
      .sidebar-scroll { scrollbar-width: none; -ms-overflow-style: none; }
      .sidebar-scroll::-webkit-scrollbar { width: 0; height: 0; display: none; }
    </style>
  </head>
  <body style="margin: 0; font-family: 'Nunito', system-ui, -apple-system, sans-serif;">
